# 工作流名称
name: Sync-Images-to-DockerHub-Example
# 工作流运行时显示名称
run-name: ${{ github.actor }} is Sync Images to DockerHub.
# 怎样触发工作流
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  syncimages:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2.9.1

    - name: Login to Docker Hub
      uses: docker/login-action@v2.2.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        logout: false
        
    - name: Use Skopeo Tools Sync Image to Docker Hub
      run: |
        #!/usr/bin/env bash
        skopeo copy --all docker://docker.io/mirantis/k8s-netchecker-server:v1.2.2 docker://pjzer0/k8s-netchecker-server:v1.2.2
        skopeo copy --all docker://docker.io/mirantis/k8s-netchecker-agent:v1.2.2 docker://pjzer0/k8s-netchecker-agent:v1.2.2
        skopeo copy --all docker://quay.io/coreos/etcd:v3.5.16 docker://pjzer0/etcd:v3.5.16
        skopeo copy --all docker://quay.io/cilium/cilium:v1.15.9 docker://pjzer0/cilium:v1.15.9
        skopeo copy --all docker://quay.io/cilium/operator:v1.15.9 docker://pjzer0/operator:v1.15.9
        skopeo copy --all docker://quay.io/cilium/hubble-relay:v1.15.9 docker://pjzer0/hubble-relay:v1.15.9
        skopeo copy --all docker://quay.io/cilium/certgen:v0.1.8 docker://pjzer0/certgen:v0.1.8
        skopeo copy --all docker://quay.io/cilium/hubble-ui:v0.11.0 docker://pjzer0/hubble-ui:v0.11.0
        skopeo copy --all docker://quay.io/cilium/hubble-ui-backend:v0.11.0 docker://pjzer0/hubble-ui-backend:v0.11.0
        skopeo copy --all docker://docker.io/envoyproxy/envoy:v1.22.5 docker://pjzer0/envoy:v1.22.5
        skopeo copy --all docker://ghcr.io/k8snetworkplumbingwg/multus-cni:v4.1.0 docker://pjzer0/multus-cni:v4.1.0
